name: witnessmark-m4

x-omnigraph: &omnigraph
  image: ${WM_OMNIGRAPH_IMAGE:-witnessmark/omnigraph@sha256:b7b8edac24ff8915346cee19eb85ac89c7aeaea6a8069d68410dcbc90e266792}
  pull_policy: never
  command:
    - --cluster
    - ${WM_OMNIGRAPH_CLUSTER:-file:///var/lib/omnigraph}
    - --bind
    - 0.0.0.0:8080
    - --unauthenticated
  environment: &omnigraph-environment
    AWS_ACCESS_KEY_ID: witnessmark
    AWS_SECRET_ACCESS_KEY: witnessmark-local-only
    AWS_REGION: us-east-1
    AWS_ENDPOINT_URL_S3: ${WM_S3_ENDPOINT:-http://wm-minio:9000}
    AWS_S3_FORCE_PATH_STYLE: "true"
    # storage.md ("S3 configuration") requires this for a plain-HTTP endpoint;
    # both test endpoints are local, disposable containers.
    AWS_ALLOW_HTTP: "true"
    OMNIGRAPH_CLUSTER_LEASE_SECONDS: ${WM_CLUSTER_LEASE_SECONDS:-2}
  volumes:
    - omnigraph-root:/var/lib/omnigraph
    - ../workload:/config:ro

services:
  wm-omnigraph-a:
    <<: *omnigraph
    container_name: wm-omnigraph-a
    ports:
      - "127.0.0.1:18080:8080"

  # Started explicitly by the failover acceptance test. Keeping B behind a
  # profile prevents a normal `compose up` from racing A for writer admission.
  wm-omnigraph-b:
    <<: *omnigraph
    container_name: wm-omnigraph-b
    profiles: [failover-b]
    ports:
      - "127.0.0.1:18081:8080"

  wm-minio:
    image: witnessmark/minio@sha256:5c9f6e9b19cdd3c333900e5102b196bfdb2e19f3e25674bfa0cef924e67dc899
    pull_policy: never
    container_name: wm-minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: witnessmark
      MINIO_ROOT_PASSWORD: witnessmark-local-only
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"

  wm-object-proxy:
    image: witnessmark/proxy@sha256:a865395be1e245d04d4e0b5a8bcc0813272a8e056f18b2cd94cb5a7230fc3e23
    pull_policy: never
    container_name: wm-object-proxy
    environment:
      WM_PROXY_BIND: 0.0.0.0:9010
      WM_PROXY_UPSTREAM: http://wm-minio:9000
      WM_PROXY_DELAY_MS: "17"
    depends_on:
      - wm-minio
    ports:
      - "127.0.0.1:19010:9010"

volumes:
  omnigraph-root:
  minio-data:
